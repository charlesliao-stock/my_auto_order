name: KMUH Auto Meal Order with Screenshots

on:
  repository_dispatch:
    types: [trigger-kmuh-order]  # 關鍵：接收來自 cron-job.org 的外部觸發訊號[cite: 3]
  workflow_dispatch:             # 保留手動觸發按鈕[cite: 3]
  schedule:
    # 台灣時間週一～週五 03:00 (相當於 UTC 週日～週四 19:00)[cite: 3]
    - cron: '0 19 * * 0-4'[cite: 3]

jobs:
  order:
    runs-on: ubuntu-latest[cite: 3]
    steps:
      - name: Checkout code[cite: 3]
        uses: actions/checkout@v4[cite: 3]

      - name: Set up Python[cite: 3]
        uses: actions/setup-python@v5[cite: 3]
        with:
          python-version: '3.10'[cite: 3]

      - name: Install system dependencies & Tesseract OCR[cite: 3]
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies[cite: 3]
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run Auto Order Script[cite: 3]
        env:
          KMUH_USERNAME: ${{ secrets.KMUH_USERNAME }}[cite: 3]
          KMUH_PASSWORD: ${{ secrets.KMUH_PASSWORD }}[cite: 3]
          MEAL_COUNT: ${{ secrets.MEAL_COUNT }}[cite: 3]
        run: |
          python order.py

      - name: Upload Screenshots as Artifacts[cite: 3]
        if: always()[cite: 3]
        uses: actions/upload-artifact@v4[cite: 3]
        with:
          name: execution-screenshots[cite: 3]
          path: screenshots/[cite: 3]

      - name: Send LINE Notification (Success)[cite: 3]
        if: success()[cite: 3]
        run: |
          curl -X POST https://api.line.me/v2/bot/message/push \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" \
          -d '{
            "to": "${{ secrets.LINE_USER_ID }}",
            "messages": [
              {
                "type": "text",
                "text": "✨ 【高醫自動訂餐】執行成功！"
              }
            ]
          }'

      - name: Send LINE Notification (Failure)[cite: 3]
        if: failure()[cite: 3]
        run: |
          curl -X POST https://api.line.me/v2/bot/message/push \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" \
          -d '{
            "to": "${{ secrets.LINE_USER_ID }}",
            "messages": [
              {
                "type": "text",
                "text": "❌ 【高醫自動訂餐】執行失敗！\n專案：${{ github.repository }}\n請檢查執行記錄與截圖：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }
            ]
          }'
