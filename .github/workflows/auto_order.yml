name: KMUH Auto Meal Order with Screenshots

on:
  repository_dispatch:
    types: [trigger-kmuh-order]
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * 0-4'

jobs:
  order:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Diagnose KMUH and KMSH connectivity
        continue-on-error: true
        run: |
          for host in www.kmuh.org.tw www.kmsh.org.tw; do
            echo "=== DNS: ${host} ==="
            getent ahosts "${host}" || true
          done
          for url in \
            "https://www.kmuh.org.tw/Web/Webportal" \
            "https://www.kmsh.org.tw/web/wwwkmhk/Nutr_Order/OrderPers.asp?br_statusKind=1"; do
            echo "=== HTTPS: ${url} ==="
            if curl -sS -L -o /dev/null \
              --connect-timeout 15 --max-time 30 \
              -w 'HTTP status: %{http_code}\nRemote IP: %{remote_ip}\nConnect time: %{time_connect}s\nTotal time: %{time_total}s\n' \
              "${url}"; then
              echo "curl exit code: 0"
            else
              result=$?
              echo "curl exit code: ${result}"
            fi
          done

      - name: Install system dependencies & Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run Auto Order Script
        id: run_order
        env:
          KMUH_USERNAME: ${{ secrets.KMUH_USERNAME }}
          KMUH_PASSWORD: ${{ secrets.KMUH_PASSWORD }}
          MEAL_COUNT: ${{ secrets.MEAL_COUNT }}
        run: |
          python order.py

      - name: Upload Screenshots as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-screenshots
          path: screenshots/

      - name: Send LINE Notification (Success)
        if: success()
        run: |
          curl -X POST https://api.line.me/v2/bot/message/push \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" \
          -d '{
            "to": "${{ secrets.LINE_USER_ID }}",
            "messages": [
              {
                "type": "text",
                "text": "✨ 【高醫自動訂餐】執行成功！\n${{ steps.run_order.outputs.order_summary }}"
              }
            ]
          }'

      - name: Send LINE Notification (Failure)
        if: failure()
        run: |
          curl -X POST https://api.line.me/v2/bot/message/push \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" \
          -d '{
            "to": "${{ secrets.LINE_USER_ID }}",
            "messages": [
              {
                "type": "text",
                "text": "❌ 【高醫自動訂餐】執行失敗！\n專案：${{ github.repository }}\n請檢查執行記錄與截圖：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }
            ]
          }'
