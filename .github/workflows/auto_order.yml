name: KMUH Auto Meal Order with Screenshots

on:
  schedule:
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

jobs:
  order:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies & Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run Auto Order Script
        env:
          KMUCH_USERNAME: ${{ secrets.KMUH_USERNAME }}
          KMUH_PASSWORD: ${{ secrets.KMUH_PASSWORD }}
          MEAL_COUNT: ${{ secrets.MEAL_COUNT }}
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
        run: |
          python order.py

      - name: Upload Screenshots as Artifacts
        if: always() # 無論成功或失敗都上傳截圖，方便你檢視畫面
        uses: actions/upload-artifact@v4
        with:
          name: execution-screenshots
          path: screenshots/
