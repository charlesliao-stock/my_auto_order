name: LINE Messaging API Notification

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 支援手動觸發測試

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Send LINE Notification (Success)
      if: success()
      run: |
        curl -X POST https://api.line.me/v2/bot/message/push \
        -H "Content-Type: application/json" \
        -H "Authorization: Bearer ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" \
        -d '{
          "to": "${{ secrets.LINE_USER_ID }}",
          "messages": [
            {
              "type": "text",
              "text": "✨ GitHub Actions 執行成功！\n專案：${{ github.repository }}\n分支：${{ github.ref_name }}\n觸發者：${{ github.actor }}"
            }
          ]
        }'

    - name: Send LINE Notification (Failure)
      if: failure()
      run: |
        curl -X POST https://api.line.me/v2/bot/message/push \
        -H "Content-Type: application/json" \
        -H "Authorization: Bearer ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" \
        -d '{
          "to": "${{ secrets.LINE_USER_ID }}",
          "messages": [
            {
              "type": "text",
              "text": "❌ GitHub Actions 執行失敗！\n專案：${{ github.repository }}\n分支：${{ github.ref_name }}\n請檢查記錄：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
          ]
        }'
